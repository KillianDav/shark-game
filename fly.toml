# fly.toml app configuration file generated for shark-game on 2026-09-07T09:54:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shark-game'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 400
    soft_limit = 200

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
